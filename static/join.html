<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2EFE7">
<title>Take a number — QueueLess</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .top { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; padding: 36px 0 8px; }
  .top h1 { font-size: clamp(44px, 7vw, 72px); }
  .strip { display: grid; grid-template-columns: auto auto; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--rule); }
  .strip > div { padding: 10px 22px 12px 0; }
  .strip > div + div { padding-left: 22px; border-left: 1px solid var(--rule); }
  .strip b { display: block; font-family: var(--display); font-stretch: 75%; font-weight: 800; font-size: 28px; line-height: 1.1; margin-top: 2px; }
  .jump { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
  .jump a { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; text-decoration: none; color: var(--ink); border: 1.5px solid var(--ink); padding: 8px 12px; border-radius: 2px; }
  .jump a:hover { background: var(--ink); color: var(--paper); }
  .active { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; margin-top: 20px; background: var(--ink); color: var(--paper); text-decoration: none; }
  .active b { font-family: var(--display); font-stretch: 75%; font-size: 22px; }
  @media (max-width: 640px) { .top { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="logo" href="/" data-logo>QueueLess</a>
    <nav class="nav"><a href="#food">Food</a><a href="#shopping">Shopping</a><a href="#payments">Payments</a><a href="#services">Services</a></nav>
  </header>

  <a id="active" class="active" hidden></a>

  <section class="top">
    <div>
      <div class="eyebrow">Take a number</div>
      <h1 class="display" style="margin-top:8px">What brings you in today?</h1>
      <p class="muted" style="margin-top:10px;max-width:560px">Tap a place, or scan its QR code with your phone. Each one opens its own page.</p>
    </div>
    <div class="strip">
      <div><span class="eyebrow">Queue wait</span><b id="wait">—</b></div>
      <div><span class="eyebrow">In line</span><b id="count">—</b></div>
    </div>
  </section>

  <div id="sections"></div>
  <div style="height:64px"></div>
</div>
<script src="/static/common.js"></script>
<script>
const SECTIONS = [
  { key: 'food', n: '01', title: 'Food', note: 'Order ahead — we ring you when it’s ready' },
  { key: 'malls', id: 'shopping', n: '02', title: 'Shopping', note: 'Pick a mall, then a store' },
  { key: 'payments', n: '03', title: 'Payments', note: 'Pay a bill at the desk' },
  { key: 'services', n: '04', title: 'Services', note: 'Get help at a counter' },
];

const existing = storage('ql_token');
if (existing) api('/api/tickets/' + existing).then(t => {
  if (['waiting', 'called', 'serving'].includes(t.status)) {
    const a = $('#active'); a.href = '/t/' + existing; a.hidden = false;
    a.innerHTML = `<span><span class="eyebrow" style="color:#bdb6a6">You're already in line</span><br><b>${esc(t.number)}</b></span><span class="mono small">View ticket →</span>`;
  }
}).catch(() => storage('ql_token', null));

const tile = it => `
  <a class="dir-tile" href="${esc(it.path)}">
    <span class="dir-logo" ${it.bg ? `style="background:${esc(it.bg)}"` : ''}>${it.logo ? `<img src="${esc(it.logo)}" alt="">` : `<span class="glyph">${esc(it.name[0])}</span>`}</span>
    <span><div class="dir-name">${esc(it.name)}</div><div class="dir-sub">${esc(it.sub || '')}</div><span class="dir-go">Open <span class="arrow">→</span></span></span>
    <span class="dir-qr" title="Scan to open on your phone"><img src="/api/link-qr.svg?to=${encodeURIComponent(it.path)}" alt="QR code for ${esc(it.name)}" loading="lazy"></span>
  </a>`;

let built = false;
async function refresh() {
  const d = await api('/api/directory');
  $('#wait').textContent = d.queue.next_wait ? fmtRange(d.queue.next_wait.low_s, d.queue.next_wait.high_s) : 'Paused';
  $('#count').textContent = d.queue.waiting;
  if (built) return;
  built = true;
  $('#sections').innerHTML = SECTIONS.map(s => `
    <section class="dir-sec" id="${s.id || s.key}">
      <div class="dir-sec-h"><h2><span class="n">${s.n}</span>${s.title}</h2><span class="eyebrow">${s.note}</span></div>
      <div class="dir-grid">${d[s.key].map(tile).join('')}</div>
    </section>`).join('');
}

let pending;
connectWS(msg => { if (msg.type === 'orders') return; clearTimeout(pending); pending = setTimeout(refresh, 200); });
refresh();
</script>
</body>
</html>
